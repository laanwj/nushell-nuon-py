[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nuon"
version = "0.1.0"
description = "NUON (Nushell Object Notation) codec matching nushell's Rust implementation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

[tool.setuptools]
packages = ["nuon"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
